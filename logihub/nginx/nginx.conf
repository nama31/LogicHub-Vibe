worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Define rate limiting zone: 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # HTTP server for HTTPS redirection
    server {
        listen 80;
        server_name localhost;
        server_tokens off;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name localhost;
        server_tokens off;

        ssl_certificate /etc/nginx/ssl/localhost.crt;
        ssl_certificate_key /etc/nginx/ssl/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Route API to backend (FastAPI)
        location /api/ {
            limit_req zone=mylimit burst=20 nodelay;
            
            # Rewrite /api/endpoints to /endpoints before sending to backend
            rewrite ^/api/(.*) /$1 break;
            
            proxy_pass http://logihub_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route everything else to frontend (Next.js)
        location / {
            limit_req zone=mylimit burst=20 nodelay;
            proxy_pass http://logihub_frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
