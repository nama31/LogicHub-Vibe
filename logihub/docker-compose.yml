services:
  db:
    image: postgres:15
    container_name: logihub_db
    restart: always
    environment:
      POSTGRES_USER: logihub
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logihub_secret}
      POSTGRES_DB: logihub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U logihub -d logihub" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: logihub_redis
    restart: always
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: logihub_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://logihub:logihub_secret@db:5432/logihub}
      JWT_SECRET: ${JWT_SECRET:-supersecret123}
      BOT_SECRET: ${BOT_SECRET:-supersecretbot321}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: sh -c "alembic -c migrations/alembic.ini upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    container_name: logihub_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    # change for local develop
    volumes:
      # Монтируем код, но исключаем node_modules, чтобы Docker брал их изнутри контейнера
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - frontend_next:/app/frontend/.next
    # Упрощаем команду — зависимости уже установлены на этапе сборки образа
    command: pnpm run dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # volumes:
    #   - ./frontend:/app/frontend
    #   - frontend_next:/app/frontend/.next
    #   - frontend_node_modules:/app/frontend/node_modules
    # command: sh -c "[ -d node_modules ] && [ \"$(ls -A node_modules)\" ] || pnpm install; exec pnpm run dev"

  bot:
    build:
      context: ./bot
    container_name: logihub_bot
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - backend
    volumes:
      - ./bot:/app/bot
    command: python -m bot.main
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build: ./nginx
    container_name: logihub_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
